<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리얼 아카데미 릴스 표지</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 공통 표지 시스템 v2 (타이포 중심): 상단 '초등 영어' / 중단 질문 2행 / 하단 '리얼 아카데미'.
     A·B·C 동일 좌표·크기(질문 112px 고정)·강조 방식(라임 슬래브). 3:4 및 1:1 그리드 크롭 안에 배치. */
  .cv-label { position:absolute; left:80px; top:560px; height:88px; padding:0 34px; border-radius:44px;
    display:flex; align-items:center; background:var(--accent); color:var(--accent-ink);
    font-size:52px; font-weight:800; letter-spacing:-0.01em; white-space:nowrap; }
  .cv-q { position:absolute; left:80px; top:700px; }
  .cv-q .line { font-size:112px; line-height:1.18; font-weight:500; letter-spacing:-0.04em; white-space:nowrap; color:var(--ink); }
  .cv-rule { position:absolute; left:80px; top:1030px; width:920px; height:6px; background:var(--line2); }
  .cv-brand { position:absolute; left:80px; top:1078px; font-size:60px; font-weight:900; letter-spacing:-0.02em; color:var(--ink); white-space:nowrap; }
</style>
</head>
<body>
<div id="stage"><div class="cover" id="cover"></div></div>
<script>
(async function () {
  const ep = (new URLSearchParams(location.search).get("ep") || "A").toUpperCase();
  const data = await (await fetch(`data/${ep}.json`)).json();
  const cv = data.cover, root = document.getElementById("cover");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const emph = (t) => { let h = esc(t); for (const e of cv.emph) h = h.split(esc(e)).join(`<span class="em">${esc(e)}</span>`); return h; };
  root.innerHTML = `<div class="cv-label" data-text="${cv.label}">${cv.label}</div>
    <div class="cv-q">${cv.lines.map((l) => `<div class="line" data-text="${esc(l)}">${emph(l)}</div>`).join("")}</div>
    <div class="cv-rule"></div>
    <div class="cv-brand" data-text="${cv.brand}">${cv.brand}</div>`;
  await document.fonts.load('500 112px "Noto Sans KR VF"', "가");
  await document.fonts.load('900 112px "Noto Sans KR VF"', "가");
  await document.fonts.ready;
  window.coverAudit = () => [...document.querySelectorAll("[data-text]")].map((el) => {
    const rg = document.createRange(); rg.selectNodeContents(el); const r = rg.getBoundingClientRect();   // the glyphs, not the box
    return { text: el.dataset.text, x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height),
      fontSize: parseFloat(getComputedStyle(el).fontSize), ems: [...el.querySelectorAll(".em")].map((s) => s.textContent) };
  });
  window.__ready = true;
})().catch((e) => (window.__error = String(e)));
</script>
</body>
</html>
