<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리얼 아카데미 릴스 표지</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* 공통 표지 시스템: 상단 '초등 영어' / 중단 질문 2행 / 하단 '리얼 아카데미'. A·B·C 동일 좌표·크기·강조 방식 */
  .cv-label { position:absolute; left:50%; top:600px; transform:translateX(-50%);
    height:84px; padding:0 34px; border-radius:42px; display:flex; align-items:center;
    background:var(--accent-soft); color:var(--accent); font-size:52px; font-weight:700; letter-spacing:-0.01em; white-space:nowrap; }
  .cv-q { position:absolute; left:90px; width:900px; top:780px; text-align:center; }
  .cv-q .line { font-size:96px; line-height:1.3; font-weight:500; letter-spacing:-0.025em; white-space:nowrap; }
  .cv-rule { position:absolute; left:50%; top:1180px; width:96px; height:8px; margin-left:-48px; border-radius:4px; background:var(--accent); }
  .cv-brand { position:absolute; left:0; width:1080px; top:1270px; text-align:center; font-size:54px; font-weight:800; letter-spacing:-0.01em; color:var(--ink); }
</style>
</head>
<body>
<div id="stage"><div class="cover" id="cover"></div></div>
<script>
(async function () {
  const ep = (new URLSearchParams(location.search).get("ep") || "A").toUpperCase();
  const data = await (await fetch(`data/${ep}.json`)).json();
  const cv = data.cover, root = document.getElementById("cover");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const emph = (t) => { let h = esc(t); for (const e of cv.emph) h = h.split(esc(e)).join(`<span class="em">${esc(e)}</span>`); return h; };
  root.innerHTML = `<div class="cv-label" data-text="${cv.label}">${cv.label}</div>
    <div class="cv-q">${cv.lines.map((l) => `<div class="line" data-text="${esc(l)}">${emph(l)}</div>`).join("")}</div>
    <div class="cv-rule"></div>
    <div class="cv-brand" data-text="${cv.brand}">${cv.brand}</div>`;
  await document.fonts.load('500 96px "Noto Sans KR VF"', "가");
  await document.fonts.load('800 96px "Noto Sans KR VF"', "가");
  await document.fonts.ready;
  window.coverAudit = () => [...document.querySelectorAll("[data-text]")].map((el) => {
    const rg = document.createRange(); rg.selectNodeContents(el); const r = rg.getBoundingClientRect();   // the glyphs, not the box
    return { text: el.dataset.text, x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height),
      fontSize: parseFloat(getComputedStyle(el).fontSize), ems: [...el.querySelectorAll(".em")].map((s) => s.textContent) };
  });
  window.__ready = true;
})().catch((e) => (window.__error = String(e)));
</script>
</body>
</html>
